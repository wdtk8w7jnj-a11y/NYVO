  --neon: 0 0 0 1px rgba(255, 45, 85, 0.75), 0 0 18px rgba(255, 30, 70, 0.28), inset 0 0 22px rgba(255, 30, 70, 0.07);
  --btn-ruby: linear-gradient(180deg, #e3173f 0%, #b10c2f 100%);
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100dvh;
  background: radial-gradient(120% 60% at 50% -10%, #12070b 0%, var(--bg) 55%) fixed, var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.4;
  font-feature-settings: 'cv11', 'ss01';
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}

h1, h2, h3, p, ul, ol, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
svg { flex: none; }
img { max-width: 100%; display: block; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend { padding: 0; }
abbr[title] { text-decoration: none; }
[hidden] { display: none !important; }

:focus-visible { outline: 2px solid var(--ruby-hi); outline-offset: 3px; border-radius: 8px; }
h1:focus, h2:focus { outline: none; }
[tabindex="-1"]:focus, [tabindex="-1"]:focus-visible { outline: none; }

.sr-only {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.skip-link {
  position: absolute; left: 12px; top: -60px; z-index: 50;
  background: var(--ruby); color: #fff; padding: 10px 14px; border-radius: 10px;
}
.skip-link:focus { top: 12px; }

.noscript { padding: 24px; }

@media (prefers-reduced-motion: no-preference) {
  .main.enter { animation: enter 0.18s ease-out; }
  @keyframes enter { from { opacity: 0.6; transform: translateY(3px); } to { opacity: 1; transform: none; } }
}
/* Composants partagés. */

/* ---------- Coque ---------- */
.shell { width: 100%; max-width: 560px; margin: 0 auto; padding: 0 var(--gutter); }
.shell.has-nav { padding-bottom: calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom)); }
.main { display: flex; flex-direction: column; gap: 18px; padding-top: max(10px, env(safe-area-inset-top)); }
.main > section, .home-col > section { display: flex; flex-direction: column; gap: 12px; }

.storage-banner {
  margin: 10px 0 0; padding: 10px 14px; border-radius: var(--radius-sm);
  border: 1px solid #6a4a16; background: #20170a; color: #f6d9a1; font-size: 14px;
}

/* ---------- Barre supérieure ---------- */
.topbar { display: flex; align-items: center; gap: 10px; min-height: 60px; }
.logo { font-weight: 900; font-size: 34px; letter-spacing: 0.01em; line-height: 1; color: #fff; text-shadow: 0 0 24px rgba(255, 255, 255, 0.08); }
.topbar .logo { margin-right: auto; }
.country-pill {
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 6px 12px 6px 10px;
  border-radius: 14px; border: 1px solid var(--line-2); background: linear-gradient(180deg, #151519, #0d0d10);
  font-size: 16px; color: var(--silver);
}
.country-pill .ruby { color: var(--ruby-hi); }
.topbar-actions { display: flex; gap: 2px; margin-left: auto; }
.icon-btn {
  display: inline-grid; place-items: center; min-width: 44px; min-height: 44px; border-radius: 12px; color: var(--text);
}
.icon-btn:hover { background: rgba(255, 255, 255, 0.05); }
.icon-btn.sm { min-width: 44px; min-height: 44px; }

.page-title { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.page-title h1 { font-size: 30px; font-weight: 750; letter-spacing: -0.01em; }
.page-title-right { margin-left: auto; }
.demo-badge {
  display: inline-flex; align-items: center; height: 30px; padding: 0 14px; border-radius: 999px;
  border: 1.5px solid var(--ruby); background: rgba(150, 10, 40, 0.35); color: #ffe3e8;
  font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  box-shadow: 0 0 14px rgba(255, 30, 70, 0.22);
}

.detailbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 56px; }
.detailbar .logo-center { font-size: 28px; }
.detailbar-actions { display: flex; justify-content: flex-end; gap: 2px; }
.star-btn.is-on, .star-btn.is-on .icon { color: var(--ruby-hi); }

/* ---------- Titres de section et liens ---------- */
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.section-head h2 { font-size: 24px; font-weight: 720; letter-spacing: -0.01em; }
.section-head h3 { font-size: 17px; }
.link-more { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; color: var(--ruby-hi); font-size: 17px; font-weight: 500; white-space: nowrap; }
.link-more.sm { font-size: 14px; min-height: 36px; }
.text-btn { min-height: 44px; padding: 0 4px; color: var(--muted); font-size: 15px; }
.text-btn.ruby { color: var(--ruby-hi); font-weight: 500; }
.text-btn.underline { text-decoration: underline; text-underline-offset: 3px; color: var(--silver); }
.text-btn.small { font-size: 14px; }

/* ---------- Boutons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px;
  border-radius: 14px; font-size: 17px; font-weight: 600; line-height: 1.1; text-align: center;
}
.btn-sm { min-height: 44px; padding: 0 14px; font-size: 15px; border-radius: 12px; }
.btn-block { width: 100%; }
.btn-primary {
  background: var(--btn-ruby); color: #fff; border: 1px solid rgba(255, 90, 120, 0.55);
  box-shadow: 0 0 22px rgba(255, 20, 60, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.18);
}
.btn-primary:hover { filter: brightness(1.08); }
.btn-outline { color: var(--ruby-hi); border: 1.5px solid var(--ruby); background: rgba(120, 8, 32, 0.18); box-shadow: 0 0 12px rgba(255, 30, 70, 0.16); }
.btn-ghost { border: 1px solid var(--line-2); background: linear-gradient(180deg, #151519, #0e0e11); color: var(--text); }
.btn-ghost.danger { color: #ff9aae; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-row.two > * { flex: 1 1 0; }

/* ---------- Groupes de choix ---------- */
.segmented {
  display: flex; padding: 3px; border-radius: 14px; border: 1px solid var(--line-2); background: #0b0b0e; gap: 3px;
}
.seg {
  flex: 1 1 0; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px;
  border-radius: 11px; color: var(--silver); font-size: 16px; padding: 0 8px; text-align: center; position: relative;
}
.seg-lg .seg { min-height: 46px; font-size: 16px; }
.seg { white-space: nowrap; }
.seg.is-on {
  background: linear-gradient(180deg, #a30d2f, #6e0820); color: #fff; font-weight: 600;
  box-shadow: inset 0 0 0 1px rgba(255, 70, 100, 0.55), 0 0 16px rgba(255, 30, 70, 0.3);
}
.seg.is-on::after { content: ''; position: absolute; left: 10%; right: 10%; bottom: -1px; height: 2px; border-radius: 2px; background: var(--ruby-hi); box-shadow: 0 0 10px var(--ruby-hi); }
.seg.is-disabled { color: var(--muted-2); cursor: not-allowed; flex-direction: column; gap: 0; }
.seg small { font-size: 11px; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; min-height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line-2);
  background: linear-gradient(180deg, #141418, #0d0d10); color: var(--silver); font-size: 16px; white-space: nowrap;
}
.chip.is-on { background: var(--btn-ruby); color: #fff; border-color: rgba(255, 90, 120, 0.6); box-shadow: 0 0 16px rgba(255, 25, 65, 0.35); }

.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; width: 100%; min-height: 52px; padding: 6px 0; text-align: left; }
.switch-label { display: flex; flex-direction: column; gap: 2px; }
.switch-label small { color: var(--muted); font-size: 13px; }
.switch { position: relative; width: 52px; height: 30px; border-radius: 999px; background: #2a2a31; border: 1px solid #3a3a42; flex: none; transition: background 0.15s; }
.switch i { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #d9dae0; transition: transform 0.15s; }
.switch.is-on { background: var(--ruby); border-color: var(--ruby-hi); box-shadow: 0 0 12px rgba(255, 30, 70, 0.4); }
.switch.is-on i { transform: translateX(22px); background: #fff; }

/* ---------- Cartes ---------- */
.card { border-radius: var(--radius); border: 1px solid var(--line); background: var(--card-bg); padding: 16px; }
.hint { color: var(--muted); font-size: 14px; }
.hint.center, .center { text-align: center; }
.small { color: var(--muted); font-size: 14px; }
.meta { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 15px; }
.demo-note { text-align: center; color: var(--muted-2); font-size: 13px; padding: 4px 0 8px; }
.empty { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 32px 18px; color: var(--muted); border: 1px dashed var(--line-2); border-radius: var(--radius); }
.empty .icon { color: var(--ruby-hi); }
.empty-title { color: var(--text); font-weight: 600; font-size: 17px; }
.empty-inline { color: var(--muted); padding: 16px 4px; }
.plain-list { display: flex; flex-direction: column; gap: 8px; padding-left: 18px; list-style: disc; color: var(--silver); }

.badge {
  display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12px;
  font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; width: fit-content;
}
.badge-dark { background: rgba(10, 10, 12, 0.78); border: 1px solid rgba(255, 255, 255, 0.35); color: #fff; backdrop-filter: blur(6px); }
.badge-outline { border: 1px solid #5d6075; color: #d9dbe6; background: rgba(30, 32, 44, 0.6); }
.badge-rumor { border: 1px solid var(--amber); color: var(--amber); background: rgba(60, 40, 5, 0.45); }
.badge-ruby { border: 1px solid var(--ruby-hi); color: #ffe7ec; background: rgba(140, 8, 36, 0.6); text-transform: none; letter-spacing: 0; font-size: 14px; font-weight: 500; height: 32px; }

/* ---------- Écussons et score ---------- */
.crest { display: block; filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.5)); }
.flag { display: block; border-radius: 3px; }
.team-block { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; font-weight: 600; font-size: 18px; min-width: 0; white-space: nowrap; }
.score-center { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; min-width: 0; }
.score { font-size: 52px; font-weight: 850; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.score-time { font-size: 46px; }
.score-sub { color: var(--muted); font-size: 15px; display: flex; flex-direction: column; align-items: center; }
.score-sub.is-live { color: var(--ruby-hi); font-size: 17px; font-weight: 500; }
.muted-line { color: var(--silver); font-size: 15px; }
.score-center.is-masked { color: var(--silver); gap: 6px; }
.score-masked { font-size: 17px; font-weight: 600; color: var(--text); }

/* Carte vedette */
.match-hero {
  position: relative; border-radius: 18px; padding: 14px 14px 16px; background:
    radial-gradient(120% 90% at 50% 0%, rgba(140, 12, 40, 0.22), transparent 60%), linear-gradient(180deg, #16090d, #0b0a0c);
  border: 1px solid rgba(255, 60, 90, 0.85); box-shadow: 0 0 22px rgba(255, 25, 65, 0.3), inset 0 0 24px rgba(255, 25, 65, 0.08);
}
.hero-top { display: flex; justify-content: space-between; align-items: center; min-height: 34px; margin-bottom: 4px; }
.pin { display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px 4px 6px; border-radius: 10px; background: rgba(255, 255, 255, 0.04); font-size: 17px; }
.pin .ruby { color: var(--ruby-hi); }
.live-pill { padding: 6px 14px; border-radius: 10px; background: linear-gradient(180deg, #b30f33, #7d0a23); border: 1px solid rgba(255, 80, 110, 0.6); font-size: 16px; }
.live-pill.is-off { background: #2b2b31; border-color: #4a4a52; }
.hero-link { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 4px; padding: 6px 0 0; border-radius: 12px; }
.hero-team { display: flex; flex-direction: column; align-items: center; gap: 8px; font-weight: 600; font-size: 18px; text-align: center; white-space: nowrap; min-width: 0; }
.hero-foot { display: flex; justify-content: center; margin-top: 8px; }
.channel-line { display: inline-flex; align-items: center; gap: 10px; color: var(--muted); font-size: 17px; }
.channel-line.is-unconfirmed { color: var(--muted); font-size: 15px; }
.spoiler-pill { display: inline-flex; align-items: center; gap: 8px; padding: 4px 14px; border-radius: 999px; border: 1.5px solid var(--ruby); color: var(--ruby-hi); font-size: 15px; box-shadow: 0 0 12px rgba(255, 30, 70, 0.2); }

/* ---------- Lignes de match ---------- */
.match-list { display: flex; flex-direction: column; }
.match-list > li + li { border-top: 1px solid var(--line); }
.card-list, .match-list.compact { border: 1px solid var(--line); border-radius: var(--radius); background: var(--card-bg); }
.match-row { display: flex; align-items: center; }
.row-link { flex: 1; min-width: 0; display: grid; grid-template-columns: 46px 24px minmax(0, 1fr) auto auto 16px; align-items: center; gap: 8px; min-height: 72px; padding: 8px 2px 8px 12px; }
.row-time { font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; }
.row-time.is-live { color: var(--ruby-hi); font-weight: 650; }
.row-time.is-done { color: var(--muted); font-size: 14px; }
.row-crests { display: flex; flex-direction: column; gap: 4px; align-items: center; }
.row-teams { display: flex; flex-direction: column; gap: 6px; font-size: 16px; min-width: 0; }
.row-teams span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-scores { display: flex; flex-direction: column; gap: 6px; font-weight: 750; font-size: 17px; font-variant-numeric: tabular-nums; text-align: right; }
.row-scores.is-live { color: var(--ruby-hi); }
.row-scores.is-masked { color: var(--muted); }
.row-channel { color: var(--muted); font-size: 13px; text-align: right; max-width: 78px; line-height: 1.25; }
.row-channel.is-unconfirmed { color: var(--muted-2); }
.row-chevron { color: var(--silver); }
.star-btn { color: var(--silver); min-width: 40px; }

/* ---------- Onglets ---------- */
.tabs { display: flex; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * var(--gutter)); padding: 0 var(--gutter); }
.tabs::-webkit-scrollbar { display: none; }
.tab-btn { flex: 1 0 auto; min-height: 50px; padding: 0 6px; color: var(--muted); font-size: 16px; position: relative; white-space: nowrap; }
.tab-btn.is-on { color: #fff; font-weight: 600; }
.tab-btn.is-on::after { content: ''; position: absolute; left: 6px; right: 6px; bottom: -1px; height: 3px; border-radius: 3px; background: var(--ruby-hi); box-shadow: 0 0 12px var(--ruby-hi); }

/* ---------- Barre d'onglets principale ---------- */
.tabbar {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; z-index: 20;
  width: 100%; max-width: 560px; padding: 0 10px env(safe-area-inset-bottom);
  background: linear-gradient(180deg, rgba(18, 18, 22, 0.96), rgba(10, 10, 12, 0.98));
  border-top: 1px solid var(--line-2); border-radius: 22px 22px 0 0; backdrop-filter: blur(16px);
  box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.6);
}
.tabbar ul { display: flex; }
.tabbar li { flex: 1; }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: var(--tabbar-h); font-size: 13px; color: var(--silver); position: relative; }
.tab .icon { width: 28px; height: 28px; }
.tab.is-active { color: var(--ruby-hi); }
.tab.is-active::before { content: ''; position: absolute; top: -1px; left: 22%; right: 22%; height: 2px; background: var(--ruby-hi); box-shadow: 0 0 14px 2px rgba(255, 40, 80, 0.55); border-radius: 2px; }
.tab.is-active .icon { filter: drop-shadow(0 0 8px rgba(255, 40, 80, 0.55)); }

/* ---------- Panneaux (dialogues) ---------- */
.sheet {
  margin: auto auto 0; padding: 0; width: 100%; max-width: 560px; max-height: 92dvh; border: 0; color: var(--text);
  background: transparent; overflow: visible;
}
.sheet::backdrop { background: rgba(0, 0, 0, 0.72); backdrop-filter: blur(6px); }
.sheet-inner {
  display: flex; flex-direction: column; max-height: 92dvh; border-radius: 26px 26px 0 0;
  border: 1px solid var(--line-2); border-bottom: 0; background: linear-gradient(180deg, #151519, #0b0b0d);
  box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 40, 80, 0.08);
}
.sheet-full .sheet-inner { min-height: 92dvh; }
.sheet-handle { width: 44px; height: 5px; border-radius: 3px; background: #4a4a52; margin: 10px auto 0; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 12px 6px 20px; }
.sheet-head h2 { font-size: 28px; font-weight: 780; letter-spacing: -0.01em; }
.sheet-body { overflow-y: auto; padding: 4px 20px calc(24px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; overscroll-behavior: contain; }
.sheet-status:empty { display: none; }
.sheet-status { margin: 0 16px 16px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--ruby); background: #2a0c15; font-size: 15px; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + 22px + env(safe-area-inset-bottom)); z-index: 40;
  max-width: min(92vw, 520px); padding: 12px 18px; border-radius: 14px; border: 1px solid var(--ruby);
  background: #22090f; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 18px rgba(255, 30, 70, 0.25); font-size: 15px;
  opacity: 0; pointer-events: none; transition: opacity 0.15s;
}
.toast.is-visible:not(:empty) { opacity: 1; }

/* ---------- Champs ---------- */
.search-field {
  display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 14px; border-radius: 14px;
  border: 1px solid var(--line-2); background: #0d0d10; color: var(--muted);
}
.search-field:focus-within { border-color: var(--ruby); box-shadow: 0 0 0 3px rgba(255, 40, 80, 0.18); }
.search-field input { flex: 1; min-width: 0; min-height: 48px; background: none; border: 0; outline: none; color: var(--text); font-size: 16px; }
.search-field input::placeholder { color: var(--muted); }
.input, .select-flag select {
  min-height: 52px; width: 100%; border-radius: 14px; border: 1px solid var(--line-2); background: #0d0d10; padding: 0 14px; color: var(--text); font-size: 17px;
}
.select-flag { position: relative; display: flex; align-items: center; }
.select-flag .flag { position: absolute; left: 14px; pointer-events: none; }
.select-flag select { appearance: none; -webkit-appearance: none; padding-left: 58px; padding-right: 44px; }
.select-flag .icon { position: absolute; right: 14px; pointer-events: none; color: var(--silver); }
.field-label { color: var(--silver); font-size: 16px; }
.check-line { display: flex; align-items: center; gap: 12px; min-height: 44px; }
.check-line input, .radio-line input { width: 22px; height: 22px; accent-color: var(--ruby); }
.radio-line { display: flex; align-items: center; gap: 12px; min-height: 44px; }
.radio-line.is-disabled { color: var(--muted-2); }

/* ---------- Médias d'illustration ---------- */
.media { position: relative; display: block; overflow: hidden; border-radius: 14px; background: #10141c; }
.media .art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.media-wide { aspect-ratio: 16 / 6.2; }
.media-video { aspect-ratio: 16 / 8; }
.media-thumb { width: 104px; aspect-ratio: 1; border-radius: 12px; flex: none; }
.media-badge { position: absolute; top: 12px; left: 12px; }
.play-ring {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 68px; height: 68px; border-radius: 50%;
  display: grid; place-items: center; background: rgba(0, 0, 0, 0.45); border: 2.5px solid #fff; color: #fff;
}
.play-ring .icon { margin-left: 4px; }
.play-ring.sm { width: 40px; height: 40px; border-width: 2px; }
.play-ring.big { width: 84px; height: 84px; }
.duration { position: absolute; right: 12px; bottom: 12px; padding: 3px 10px; border-radius: 10px; background: rgba(0, 0, 0, 0.7); border: 1px solid rgba(255, 255, 255, 0.25); font-size: 15px; font-variant-numeric: tabular-nums; }
.avatar { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: #2b2d36; color: #c9cbd6; }
.avatar.lg { width: 48px; height: 48px; }
.avatar.xl { width: 96px; height: 96px; }

/* ---------- Carte masquée (sans spoilers) ---------- */
.masked-card { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: var(--radius); border: 1px solid var(--line-2); background: var(--card-bg); }
.masked-card > .icon { color: var(--silver); }
.masked-card div { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.masked-card small { color: var(--muted); font-size: 14px; }

/* ---------- Liste de choix ---------- */
.pick-list { display: flex; flex-direction: column; gap: 10px; }
.pick-row {
  display: flex; align-items: center; gap: 14px; width: 100%; min-height: 72px; padding: 10px 16px; border-radius: 16px;
  border: 1px solid var(--line); background: var(--card-bg); cursor: pointer; text-align: left;
}
.pick-row.is-on { border-color: rgba(255, 60, 90, 0.85); background: linear-gradient(180deg, #2a0a13, #14070b); box-shadow: 0 0 16px rgba(255, 25, 65, 0.25); }
.pick-row:has(input:focus-visible) { outline: 2px solid var(--ruby-hi); outline-offset: 2px; }
.pick-text { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pick-text b { font-size: 18px; font-weight: 600; }
.pick-text small { color: var(--muted); font-size: 15px; }
.pick-icon { display: inline-grid; place-items: center; width: 44px; height: 44px; color: var(--silver); }
.pick-icon.xl { width: 96px; height: 96px; border-radius: 24px; border: 1px solid var(--line-2); background: var(--card-bg); }
.check { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid #c5c7d0; display: grid; place-items: center; flex: none; }
.pick-row.is-on .check { background: var(--ruby); border-color: var(--ruby-hi); color: #fff; box-shadow: 0 0 12px rgba(255, 30, 70, 0.45); }

.radio-list { display: flex; flex-direction: column; gap: 10px; }
.radio-row {
  display: flex; align-items: center; gap: 16px; min-height: 58px; padding: 8px 16px; border-radius: 14px;
  border: 1px solid var(--line); background: var(--card-bg); cursor: pointer; position: relative;
}
.radio-row input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.radio-row:has(input:focus-visible) { outline: 2px solid var(--ruby-hi); outline-offset: 2px; }
.radio-name { flex: 1; font-size: 18px; }
.radio-dot { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid #c5c7d0; position: relative; }
.radio-row.is-on { border-color: rgba(255, 60, 90, 0.85); background: linear-gradient(180deg, #2a0a13, #14070b); box-shadow: 0 0 16px rgba(255, 25, 65, 0.25); }
.radio-row.is-on .radio-dot { border-color: var(--ruby-hi); }
.radio-row.is-on .radio-dot::after { content: ''; position: absolute; inset: 5px; border-radius: 50%; background: var(--ruby-hi); box-shadow: 0 0 10px var(--ruby-hi); }

.tag-list { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--ruby); background: rgba(120, 8, 32, 0.25); font-size: 16px; }
/* Styles propres à chaque écran. */

/* ---------- Premier lancement ---------- */
.onboarding { display: flex; flex-direction: column; gap: 16px; padding-bottom: 24px; }
.ob-bar { display: flex; align-items: center; gap: 12px; min-height: 60px; }
.ob-bar .logo { margin-right: auto; }
.ob-bar .icon-btn + .logo { margin-left: 4px; }
.ob-step { color: var(--silver); font-size: 18px; }
.ob-content { display: flex; flex-direction: column; gap: 14px; }
.ob-title { font-size: 34px; font-weight: 820; letter-spacing: -0.015em; line-height: 1.1; }
.ob-lead { font-size: 22px; color: #b4b9d0; font-weight: 500; margin-top: -6px; }
.ob-text { color: var(--silver); font-size: 16px; }
.lang-box { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; background: var(--card-bg); display: flex; flex-direction: column; gap: 12px; }
.lang-box legend { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 17px; float: left; width: 100%; margin-bottom: 4px; }
.lang-box legend + * { clear: both; }
.lang-box .seg { cursor: pointer; }
.lang-box .seg:has(input:focus-visible) { outline: 2px solid var(--ruby-hi); }
.ob-count { display: flex; gap: 14px; align-items: flex-start; padding-top: 14px; border-top: 1px solid var(--line); }
.ob-count div { display: flex; flex-direction: column; gap: 2px; }
.ob-count small { color: var(--muted); font-size: 15px; }

/* ---------- Accueil ---------- */
.home-grid, .home-col { display: flex; flex-direction: column; gap: 22px; }
.programme-card { padding: 0; overflow: hidden; }
.programme-card.is-empty { display: flex; gap: 12px; align-items: center; padding: 16px; color: var(--muted); }
.programme-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 18px 18px 16px; border-bottom: 1px solid var(--line); }
.programme-head b { font-size: 20px; font-weight: 650; }
.programme-head span { color: var(--muted); white-space: nowrap; font-size: 15px; }
.programme-list li { display: grid; grid-template-columns: 62px 36px 1fr auto; align-items: center; gap: 10px; min-height: 62px; padding: 0 18px; }
.programme-list li + li { border-top: 1px solid var(--line); }
.programme-card > .hint { padding: 0 18px 14px; }
.p-time { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.p-icon { display: grid; place-items: center; color: var(--ruby-hi); }
.p-icon.pre { width: 30px; height: 30px; border-radius: 50%; background: var(--ruby); color: #fff; }
.p-icon.pre .icon { margin-left: 2px; }
.p-label { font-size: 18px; }
.p-label small { color: var(--muted); font-size: 13px; }
.p-channel { color: var(--muted); font-size: 15px; white-space: nowrap; }
.invite { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 16px; border-radius: var(--radius); border: 1px dashed rgba(255, 70, 100, 0.55); background: rgba(70, 6, 20, 0.25); text-align: left; }
.invite > .icon:first-child { color: var(--ruby-hi); }
.invite span { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.invite small { color: var(--muted); }
.news-home a { display: flex; flex-direction: column; gap: 8px; }
.news-home-title { font-size: 21px; font-weight: 650; line-height: 1.25; }
.news-home .media-wide { aspect-ratio: 16 / 5.6; }

/* ---------- Matchs ---------- */
.date-nav { display: grid; grid-template-columns: 52px 1fr 52px; align-items: center; min-height: 56px; border-radius: 14px; border: 1px solid var(--line-2); background: linear-gradient(180deg, #131317, #0c0c0f); }
.date-center { display: inline-flex; align-items: center; justify-content: center; gap: 12px; min-height: 52px; font-size: 18px; }
.filter-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.filter-btn { text-align: center; min-height: 48px; border-radius: 12px; border: 1px solid var(--line-2); background: linear-gradient(180deg, #141418, #0c0c0f); font-size: 16px; color: var(--silver); padding: 0 4px; }
.filter-btn.is-on { background: var(--btn-ruby); color: #fff; border-color: rgba(255, 90, 120, 0.6); box-shadow: 0 0 18px rgba(255, 25, 65, 0.4); font-weight: 600; }
.options-row { display: grid; grid-template-columns: 1.15fr auto 1fr; gap: 10px; align-items: center; }
.options-row::before { content: ''; grid-column: 2; grid-row: 1; width: 1px; height: 32px; background: var(--line-2); }
.options-row > :first-child { grid-column: 1; grid-row: 1; }
.options-row > :last-child { grid-column: 3; grid-row: 1; }
.toggle-pill { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 52px; padding: 0 10px 0 12px; border-radius: 14px; border: 1px solid var(--line-2); background: linear-gradient(180deg, #131317, #0c0c0f); font-size: 15px; text-align: left; }
.toggle-pill .switch { width: 46px; height: 28px; }
.toggle-pill .switch i { width: 20px; height: 20px; }
.toggle-pill .switch.is-on i { transform: translateX(18px); }
.options-row .switch-row { min-height: 52px; padding: 0 12px; border-radius: 14px; border: 1px solid var(--line-2); background: linear-gradient(180deg, #131317, #0c0c0f); }
.select-pill { position: relative; display: flex; align-items: center; }
.select-pill select { appearance: none; -webkit-appearance: none; width: 100%; min-height: 52px; padding: 0 34px 0 12px; border-radius: 14px; border: 1px solid var(--line-2); background: linear-gradient(180deg, #131317, #0c0c0f); font-size: 15px; color: var(--text); }
.select-pill .icon { position: absolute; right: 12px; pointer-events: none; color: var(--silver); }
.matches-content { display: flex; flex-direction: column; gap: 14px; }
.comp-group { border-radius: var(--radius); border: 1px solid var(--line); background: var(--card-bg); overflow: hidden; }
.comp-head { font-size: inherit; }
.comp-toggle { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 0 16px; font-size: 22px; font-weight: 600; border-bottom: 1px solid var(--line); }
.comp-toggle span { flex: 1; }
.comp-toggle[aria-expanded='false'] { border-bottom: 0; }

/* ---------- Fiche match ---------- */
.match-head { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.comp-line { display: inline-flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 600; min-height: 40px; }
.match-sub { color: var(--muted); font-size: 16px; }
.match-teams { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 6px; width: 100%; margin-top: 8px; }
.match-teams .score { font-size: 54px; }
.match-teams .crest { width: 68px; height: 79px; }
.tz-line { color: var(--muted); font-size: 14px; }
.bc-box { display: flex; align-items: center; gap: 14px; padding: 12px 12px 12px 16px; border-radius: var(--radius); border: 1px solid var(--line-2); background: var(--card-bg); }
.bc-text { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.bc-text b { font-weight: 500; font-size: 16px; }
.bc-text small { color: var(--muted); font-size: 14px; }
.bc-box .btn { white-space: nowrap; }
.state-card { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 20px 18px; border-radius: var(--radius); border: 1px solid var(--line-2); background: var(--card-bg); }
.state-card h2, .state-card h3 { font-size: 24px; font-weight: 720; }
.state-card p { color: var(--silver); }
.state-card .small { color: var(--muted); }
.state-card.is-compact h2 { font-size: 19px; }
.state-card .btn { margin-top: 6px; }
.tab-panel { display: flex; flex-direction: column; gap: 16px; }
.tab-panel:focus-visible { outline-offset: 6px; }
.panel-title { font-size: 22px; font-weight: 700; }
.timeline { display: flex; flex-direction: column; position: relative; }
.tl-item { display: grid; grid-template-columns: 42px 44px 1fr; gap: 10px; align-items: start; padding: 8px 0 16px; position: relative; }
.tl-item::before { content: ''; position: absolute; left: 73px; top: 0; bottom: 0; width: 2px; background: var(--ruby); box-shadow: 0 0 8px var(--ruby-glow); }
.tl-item:first-child::before { top: 18px; }
.tl-item:last-child::before { bottom: 30px; }
.tl-min { font-size: 20px; font-weight: 600; padding-top: 6px; font-variant-numeric: tabular-nums; }
.tl-node { position: relative; z-index: 1; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; }
.tl-node.goal { background: #0b0b0d; border: 2px solid var(--ruby-hi); box-shadow: 0 0 12px var(--ruby-glow); color: #fff; }
.tl-node.sub { background: var(--bg); flex-direction: column; gap: 0; }
.tl-node .in { color: var(--green); display: block; height: 16px; margin-top: -6px; }
.tl-node .out { color: #ff3355; display: block; height: 16px; margin-top: -6px; }
.tl-body { display: flex; flex-direction: column; gap: 4px; padding-top: 4px; }
.tl-body b { font-size: 17px; font-weight: 600; }
.tl-body .link-more { align-self: flex-start; min-height: 44px; }
.tl-body span { color: var(--muted); }
.pre-match { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; color: var(--silver); padding: 6px 0; }
.pre-match h2 { align-self: flex-start; font-size: 24px; }
.moments { display: flex; flex-direction: column; gap: 12px; }
.moments h2 { font-size: 24px; }
.moment-list { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.moment-card { display: flex; flex-direction: column; gap: 4px; text-align: left; width: 100%; }
.moment-card b { font-size: 18px; margin-top: 6px; }
.moment-card > span:last-child { color: var(--muted); font-size: 15px; }
.moment-media { position: relative; display: block; border-radius: 12px; overflow: hidden; border: 1px solid #3d5c45; }
.pitch-svg { display: block; width: 100%; height: auto; }
.moment-open { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; border: 2px solid #fff; background: rgba(0, 0, 0, 0.45); }
.locked-card { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 22px; border-radius: var(--radius); border: 1px solid var(--line-2); background: var(--card-bg); text-align: center; }
.locked-card .lock { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: #24242a; }
.locked-card > span:last-child { color: var(--silver); }
.masked-panel { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; padding: 22px 18px; border-radius: var(--radius); border: 1px solid var(--line-2); background: var(--card-bg); }
.masked-panel .ring { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--ruby); box-shadow: 0 0 14px var(--ruby-glow); }
.masked-panel h2 { font-size: 26px; }
.masked-panel > p { color: var(--silver); }
.lineups { display: flex; flex-direction: column; gap: 12px; }
.lineup-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; color: var(--silver); }
.lineup-svg { width: 100%; max-width: 420px; align-self: center; border-radius: 12px; }
.lineups h3 { font-size: 18px; margin-top: 4px; }
.player-list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--card-bg); }
.player-list li { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px 12px; flex-wrap: wrap; }
.player-list li + li { border-top: 1px solid var(--line); }
.num { width: 26px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pname { flex: 1; }
.pos { color: var(--muted); width: 18px; }
.mark { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--silver); }
.mark.in .icon { color: var(--green); }
.mark.out .icon { color: #ff3355; }
.mark.goal .icon { color: var(--ruby-hi); }
.stats { display: flex; flex-direction: column; gap: 12px; }
.stats-head { display: flex; justify-content: space-between; font-weight: 600; }
.stats ul { display: flex; flex-direction: column; gap: 14px; }
.stat-line { display: grid; grid-template-columns: 70px 1fr 70px; align-items: center; text-align: center; }
.stat-line > :first-child { text-align: left; }
.stat-line > :last-child { text-align: right; }
.stat-label { color: var(--silver); font-size: 15px; }
.stat-bars { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
.stat-bars span { height: 6px; border-radius: 6px; background: #2a2a31; position: relative; overflow: hidden; }
.stat-bars span::after { content: ''; position: absolute; top: 0; bottom: 0; width: var(--w); border-radius: 6px; }
.stat-bars span:first-child::after { right: 0; background: var(--ruby-hi); box-shadow: 0 0 8px var(--ruby-glow); }
.stat-bars span:last-child::after { left: 0; background: #c9cbd6; }
.stat.is-na .stat-line { color: var(--muted); }
.standings table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.standings caption { text-align: left; color: var(--muted); font-size: 14px; padding-bottom: 10px; }
.standings th, .standings td { padding: 10px 6px; border-bottom: 1px solid var(--line); text-align: center; font-weight: 400; }
.standings thead th { color: var(--muted); font-size: 13px; }
.standings tbody th { text-align: left; display: flex; align-items: center; gap: 8px; }
.standings tr.is-me { background: var(--ruby-soft); }
.standings tr.is-me th { font-weight: 650; }
.standings tr.zone td:first-child { box-shadow: inset 3px 0 0 var(--ruby-hi); }
.legend { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; color: var(--muted); font-size: 14px; }
.legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--ruby-hi); margin-right: 8px; }
.bracket { display: flex; flex-direction: column; gap: 14px; }
.bracket h3 { font-size: 18px; margin-bottom: 8px; }
.bracket li a { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card-bg); margin-bottom: 8px; }
.bracket li a span { flex: 1; }
.bracket li a small { color: var(--muted); }
.bracket li.is-me a { border-color: var(--ruby); }
.demo-panel { border: 1px dashed var(--line-2); border-radius: var(--radius); padding: 0 14px; }
.demo-panel summary { display: flex; align-items: center; gap: 10px; min-height: 52px; color: var(--silver); cursor: pointer; list-style: none; }
.demo-panel summary::-webkit-details-marker { display: none; }
.demo-panel[open] { padding-bottom: 10px; }

/* ---------- Où regarder ---------- */
.watch { display: flex; flex-direction: column; gap: 14px; }
.watch-teams { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; }
.team-mini { display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 600; font-size: 15px; text-align: center; }
.watch-title { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; }
.watch-title b { font-size: 17px; font-weight: 600; }
.watch-title span { color: var(--muted); }
.watch-time { font-size: 26px; font-weight: 750; }
.bc-options { display: flex; flex-direction: column; gap: 12px; }
.bc-option { display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: var(--radius); border: 1px solid var(--line-2); background: var(--card-bg); }
.bc-option.is-featured { border-color: rgba(255, 60, 90, 0.85); background: linear-gradient(180deg, #1c080e, #0c0a0b); box-shadow: 0 0 18px rgba(255, 25, 65, 0.25); }
.bc-option-head { display: flex; gap: 12px; align-items: flex-start; position: relative; }
.bc-option-head .badge { position: absolute; top: 0; right: 0; height: 28px; font-size: 13px; }
.bc-logo { width: 54px; height: 54px; border-radius: 14px; border: 1px solid var(--line-2); display: grid; place-items: center; background: #0b0b0d; flex: none; }
.bc-option-text { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.bc-option-text b { font-size: 19px; font-weight: 650; padding-right: 116px; white-space: nowrap; }
.bc-option-text > span { color: var(--muted); }
.lockline { display: inline-flex; align-items: center; gap: 6px; }
.bc-dest { text-align: center; color: var(--silver); font-size: 14px; }
.bc-dest small { color: var(--muted); }
.bc-more { align-self: flex-end; }
.evening { border: 1px solid var(--line-2); border-radius: var(--radius); background: var(--card-bg); padding: 0 16px; }
.evening li { display: grid; grid-template-columns: 76px 1fr; align-items: center; min-height: 64px; }
.evening li + li { border-top: 1px solid var(--line); }
.ev-time { font-size: 22px; font-weight: 550; border-right: 1px solid var(--line-2); font-variant-numeric: tabular-nums; }
.ev-text { display: flex; flex-direction: column; padding-left: 16px; }
.ev-text b { font-weight: 500; font-size: 18px; }
.ev-text span { color: var(--muted); }
.note { display: flex; align-items: center; gap: 10px; color: var(--silver); font-size: 15px; }
.sources { border-top: 1px solid var(--line); padding-top: 12px; color: var(--muted); font-size: 15px; }
.access-pick { display: flex; flex-direction: column; gap: 6px; }
.state-card.in-sheet { padding: 18px; }

/* ---------- Actualités et vidéos ---------- */
.news-feature { position: relative; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); }
.news-feature-link { display: block; position: relative; }
.news-feature .media { aspect-ratio: 4 / 3.1; border-radius: 0; }
.news-feature-body { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 14px 16px 16px; background: linear-gradient(180deg, rgba(0, 0, 0, 0.1) 30%, rgba(0, 0, 0, 0.85)); }
.news-feature-title { font-size: 26px; font-weight: 700; line-height: 1.2; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6); margin-top: auto; margin-bottom: 8px; padding-right: 40px; }
.news-feature .meta { color: #d8dae4; }
.news-feature .bookmark-btn { position: absolute; right: 8px; bottom: 54px; }
.bookmark-btn { color: var(--silver); }
.bookmark-btn.is-on { color: var(--ruby-hi); }
.bookmark-btn.is-edit { color: #ff9aae; }
.news-list { display: flex; flex-direction: column; gap: 12px; }
.news-row { position: relative; border-radius: var(--radius); border: 1px solid var(--line); background: var(--card-bg); }
.news-row > a { display: flex; gap: 14px; align-items: center; padding: 10px 10px 10px 10px; }
.news-row-body { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; padding-right: 36px; }
.news-row-title { font-size: 18px; font-weight: 650; line-height: 1.25; }
.news-row .bookmark-btn { position: absolute; top: 4px; right: 4px; }
.unconfirmed { color: var(--muted); font-style: italic; font-size: 15px; }
.why { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 44px; color: var(--silver); align-self: center; }
.video-list { display: flex; flex-direction: column; gap: 14px; }
.video-card { border-radius: var(--radius); border: 1px solid var(--line); background: var(--card-bg); overflow: hidden; position: relative; }

.video-actions { position: absolute; right: 8px; bottom: 14px; display: flex; align-items: center; gap: 2px; }

.article { display: flex; flex-direction: column; gap: 12px; }

/* ---------- Favoris ---------- */
.fav-group { border-radius: var(--radius); border: 1px solid var(--line); background: var(--card-bg); overflow: hidden; }
.fav-row { display: flex; align-items: center; gap: 2px; padding-right: 4px; }

.fav-row > a:first-child { flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; min-height: 72px; padding: 8px 8px 8px 16px; }

.account-card > div { flex: 1; display: flex; flex-direction: column; }

.saved-section { display: flex; flex-direction: column; gap: 12px; padding: 14px 10px; }

.saved-card > a { display: flex; align-items: center; gap: 14px; padding: 8px 10px 8px 8px; }
.saved-media { position: relative; width: 140px; aspect-ratio: 1.12; border-radius: 10px; overflow: hidden; flex: none; background: linear-gradient(160deg, #1a1d29, #0c0d12); display: grid; place-items: center; }

.vs-media { display: flex; align-items: center; gap: 6px; color: var(--muted); padding-top: 18px; }

.guide-list { padding: 0; }
.guide-row a { display: grid; grid-template-columns: 56px 32px 1fr auto; align-items: center; gap: 10px; min-height: 68px; padding: 8px 14px; }
