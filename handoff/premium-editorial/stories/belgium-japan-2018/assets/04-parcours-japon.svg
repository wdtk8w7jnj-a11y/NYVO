<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 1080" role="img" aria-labelledby="t d"><title id="t">Le Japon a pesé sur Belgique–Japon 2018</title><desc id="d">Frise non exhaustive : Inui menace à la 31e, Osako en fin de première période, Haraguchi marque à la 48e, Inui à la 52e, Honda obtient un corner après un coup franc à 90 plus 2, puis Chadli marque à 90 plus 4.</desc><rect width="620" height="1080" fill="#09090B"/><text x="42" y="52" fill="#B7223A" font-family="Arial,sans-serif" font-size="14" font-weight="bold" letter-spacing="2.5">NYVO STORY / LE POINT DE VUE JAPONAIS</text><text x="42" y="105" fill="#F4F0E8" font-family="Arial,sans-serif" font-size="29" font-weight="bold">Le Japon a pesé</text><text x="42" y="138" fill="#A49D94" font-family="Arial,sans-serif" font-size="16">Temps forts choisis · Belgique 3–2 Japon</text><rect x="42" y="164" width="536" height="92" rx="14" fill="#131316" stroke="#38383D"/><text x="70" y="199" fill="#A49D94" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">LEUR AVANCE</text><text x="70" y="235" fill="#F4F0E8" font-family="Arial,sans-serif" font-size="27" font-weight="bold">Japon 2–0 à la 52e</text><line x1="78" y1="315" x2="78" y2="944" stroke="#44444A" stroke-width="3"/><line x1="78" y1="315" x2="78" y2="838" stroke="#D6CEC2" stroke-width="3"/><line x1="78" y1="838" x2="78" y2="944" stroke="#B7223A" stroke-width="3"/><g font-family="Arial,sans-serif"><g><circle cx="78" cy="328" r="10" fill="#09090B" stroke="#F4F0E8" stroke-width="4"/><rect x="112" y="294" width="466" height="74" rx="12" fill="#131316" stroke="#34343A"/><text x="132" y="323" fill="#F4F0E8" font-size="17" font-weight="bold">31' · INUI</text><text x="132" y="348" fill="#A49D94" font-size="14">Tête sur un centre de Nagatomo, arrêtée.</text></g><g><circle cx="78" cy="437" r="10" fill="#09090B" stroke="#F4F0E8" stroke-width="4"/><rect x="112" y="397" width="466" height="82" rx="12" fill="#131316" stroke="#34343A"/><text x="132" y="428" fill="#F4F0E8" font-size="17" font-weight="bold">FIN DE 1RE PÉRIODE · OSAKO</text><text x="132" y="454" fill="#A49D94" font-size="14">Dévie un centre de Nagatomo, de peu à côté.</text></g><g><circle cx="78" cy="548" r="10" fill="#09090B" stroke="#F4F0E8" stroke-width="4"/><rect x="112" y="510" width="466" height="76" rx="12" fill="#131316" stroke="#34343A"/><text x="132" y="539" fill="#F4F0E8" font-size="17" font-weight="bold">48' · HARAGUCHI</text><text x="132" y="564" fill="#A49D94" font-size="14">Lancé par Shibasaki · Japon 1–0.</text></g><g><circle cx="78" cy="657" r="10" fill="#09090B" stroke="#F4F0E8" stroke-width="4"/><rect x="112" y="619" width="466" height="76" rx="12" fill="#131316" stroke="#34343A"/><text x="132" y="648" fill="#F4F0E8" font-size="17" font-weight="bold">52' · INUI</text><text x="132" y="673" fill="#A49D94" font-size="14">Servi par Kagawa · Japon 2–0.</text></g><g><circle cx="78" cy="766" r="10" fill="#09090B" stroke="#F4F0E8" stroke-width="4"/><rect x="112" y="728" width="466" height="76" rx="12" fill="#131316" stroke="#34343A"/><text x="132" y="757" fill="#F4F0E8" font-size="17" font-weight="bold">90+2' · HONDA</text><text x="132" y="782" fill="#A49D94" font-size="14">Coup franc détourné en corner par Courtois.</text></g><g><circle cx="78" cy="875" r="10" fill="#09090B" stroke="#B7223A" stroke-width="4"/><rect x="112" y="837" width="466" height="76" rx="12" fill="#171316" stroke="#5E1F2D"/><text x="132" y="866" fill="#F4F0E8" font-size="17" font-weight="bold">90+4' · CHADLI</text><text x="132" y="891" fill="#D1B6BA" font-size="14">Contre belge · score final 3–2.</text></g></g><text x="42" y="979" fill="#A49D94" font-family="Arial,sans-serif" font-size="13">Frise de quelques temps forts, non exhaustive.</text><text x="42" y="1005" fill="#77736D" font-family="Arial,sans-serif" font-size="12">Repères : JFA et FIFA · illustration originale NYVO.</text></svg>