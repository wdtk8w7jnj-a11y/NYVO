<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="t d"><title id="t">Chronologie après le double changement belge</title><desc id="d">Fellaini et Chadli entrent à 65 minutes. Vertonghen, Fellaini et Chadli marquent à 69, 74 et 90 plus 4. Deux des trois buts belges après 65 minutes sont inscrits par les entrants. La chronologie ne prouve pas la causalité.</desc><rect width="1100" height="650" fill="#09090B"/><text x="64" y="60" fill="#B7223A" font-family="Arial,sans-serif" font-size="14" font-weight="bold" letter-spacing="3">NYVO STORY / REPÈRES DU MATCH</text><text x="64" y="115" fill="#F4F0E8" font-family="Arial,sans-serif" font-size="36" font-weight="bold">Après le double changement</text><text x="64" y="148" fill="#A49D94" font-family="Arial,sans-serif" font-size="17">La Belgique est menée 0–2 · chronologie jusqu'au 3–2</text><rect x="64" y="180" width="972" height="126" rx="14" fill="#131316" stroke="#38383D"/><text x="100" y="220" fill="#A49D94" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">65' / DEUX REMPLACEMENTS</text><text x="100" y="258" fill="#F4F0E8" font-family="Arial,sans-serif" font-size="21" font-weight="bold">Fellaini + Chadli entrent</text><text x="100" y="284" fill="#A49D94" font-family="Arial,sans-serif" font-size="15">Mertens + Carrasco sortent</text><rect x="700" y="197" width="300" height="92" rx="10" fill="#1B1114" stroke="#672034"/><text x="730" y="231" fill="#E5A0AB" font-family="Arial,sans-serif" font-size="12" font-weight="bold">BUTS BELGES APRÈS 65'</text><text x="730" y="270" fill="#F4F0E8" font-family="Arial,sans-serif" font-size="26" font-weight="bold">2/3 par les entrants</text><text x="64" y="357" fill="#A49D94" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">MINUTES DE MATCH →</text><line x1="110" y1="423" x2="990" y2="423" stroke="#B7223A" stroke-width="3"/><g stroke="#505057"><path d="M135 410v-35M375 436v48M615 410v-35M970 436v48"/></g><g fill="#09090B" stroke-width="4"><circle cx="135" cy="423" r="10" stroke="#F4F0E8"/><circle cx="375" cy="423" r="10" stroke="#B7223A"/><circle cx="615" cy="423" r="10" stroke="#B7223A"/><circle cx="970" cy="423" r="10" fill="#B7223A" stroke="#B7223A"/></g><g font-family="Arial,sans-serif" text-anchor="middle"><text x="135" y="367" fill="#F4F0E8" font-size="19" font-weight="bold">65'</text><text x="135" y="515" fill="#F4F0E8" font-size="16" font-weight="bold">Changements</text><text x="135" y="540" fill="#A49D94" font-size="13">score 0–2</text><text x="375" y="516" fill="#F4F0E8" font-size="19" font-weight="bold">69'</text><text x="375" y="542" fill="#A49D94" font-size="14">Vertonghen · 1–2</text><text x="615" y="367" fill="#F4F0E8" font-size="19" font-weight="bold">74'</text><text x="615" y="515" fill="#F4F0E8" font-size="16" font-weight="bold">Fellaini · 2–2</text><text x="615" y="540" fill="#A49D94" font-size="13">égalisation</text><text x="970" y="516" fill="#F4F0E8" font-size="19" font-weight="bold">90+4'</text><text x="970" y="542" fill="#A49D94" font-size="14">Chadli · 3–2</text></g><g font-family="Arial,sans-serif" font-size="12" text-anchor="middle" fill="#D5CEC3"><rect x="245" y="392" width="72" height="25" rx="12" fill="#202024"/><text x="281" y="409">+4 min</text><rect x="485" y="392" width="72" height="25" rx="12" fill="#202024"/><text x="521" y="409">+5 min</text><rect x="770" y="392" width="82" height="25" rx="12" fill="#202024"/><text x="811" y="409">+20 min*</text></g><text x="64" y="615" fill="#77736D" font-family="Arial,sans-serif" font-size="12">*Écarts selon les minutes affichées, arrêts de jeu compris. La chronologie ne prouve pas la causalité. Source : FIFA.</text></svg>