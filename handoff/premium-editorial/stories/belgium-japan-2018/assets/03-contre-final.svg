<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img" aria-labelledby="t d"><title id="t">Le contre belge à 90 minutes plus 4</title><desc id="d">Schéma indicatif : Courtois relance vers De Bruyne, qui avance et transmet à Meunier. Meunier centre bas; Lukaku laisse passer et Chadli marque. Positions illustratives sans tracking.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#C12A43"/></marker></defs><rect width="1100" height="760" fill="#09090B"/><text x="64" y="60" fill="#B7223A" font-family="Arial,sans-serif" font-size="14" font-weight="bold" letter-spacing="3">NYVO STORY / SCHÉMA TACTIQUE</text><text x="64" y="115" fill="#F4F0E8" font-family="Arial,sans-serif" font-size="34" font-weight="bold">90+4' — le contre qui décide</text><text x="64" y="148" fill="#A49D94" font-family="Arial,sans-serif" font-size="16">Belgique 3–2 Japon · séquence rapportée par FIFA</text><rect x="64" y="180" width="972" height="450" rx="14" fill="#101013" stroke="#34343A"/><rect x="86" y="202" width="928" height="406" fill="#0D1210" stroke="#66615A" stroke-width="2"/><line x1="550" y1="202" x2="550" y2="608" stroke="#47433E" stroke-width="2"/><circle cx="550" cy="405" r="53" fill="none" stroke="#47433E" stroke-width="2"/><rect x="86" y="304" width="130" height="202" fill="none" stroke="#47433E" stroke-width="2"/><rect x="884" y="304" width="130" height="202" fill="none" stroke="#47433E" stroke-width="2"/><rect x="969" y="350" width="18" height="110" fill="none" stroke="#DDD5C9" stroke-width="3"/><path d="M180 484 Q260 440 335 382" fill="none" stroke="#C12A43" stroke-width="4" marker-end="url(#a)"/><path d="M360 376 Q490 338 640 300" fill="none" stroke="#C12A43" stroke-width="4" marker-end="url(#a)"/><path d="M665 307 Q750 332 806 382 T938 466" fill="none" stroke="#C12A43" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#a)"/><g fill="#F4F0E8" stroke="#09090B" stroke-width="4"><circle cx="180" cy="484" r="16"/><circle cx="345" cy="377" r="16"/><circle cx="652" cy="303" r="16"/><circle cx="814" cy="386" r="16"/><circle cx="936" cy="468" r="16"/></g><g fill="#09090B" font-family="Arial,sans-serif" font-size="12" font-weight="bold" text-anchor="middle"><text x="180" y="488">1</text><text x="345" y="381">2</text><text x="652" y="307">3</text><text x="814" y="390">4</text><text x="936" y="472">5</text></g><g font-family="Arial,sans-serif" font-size="13"><text x="116" y="534" fill="#F4F0E8" font-weight="bold">COURTOIS</text><text x="116" y="553" fill="#A49D94">relance au sol</text><text x="293" y="418" fill="#F4F0E8" font-weight="bold">DE BRUYNE</text><text x="293" y="437" fill="#A49D94">avance, transmet</text><text x="610" y="269" fill="#F4F0E8" font-weight="bold">MEUNIER</text><text x="610" y="288" fill="#A49D94">centre bas</text><text x="767" y="424" fill="#F4F0E8" font-weight="bold">LUKAKU</text><text x="767" y="443" fill="#A49D94">laisse passer</text><text x="902" y="514" fill="#F4F0E8" font-weight="bold">CHADLI</text><text x="902" y="533" fill="#A49D94">conclut</text></g><rect x="64" y="655" width="972" height="62" rx="10" fill="#171316" stroke="#45202A"/><text x="90" y="693" fill="#E5A0AB" font-family="Arial,sans-serif" font-size="14" font-weight="bold">LECTURE SCHÉMATIQUE</text><text x="300" y="693" fill="#C4BDB3" font-family="Arial,sans-serif" font-size="13">La séquence est sourcée; placements et trajectoires sont indicatifs, sans tracking.</text></svg>