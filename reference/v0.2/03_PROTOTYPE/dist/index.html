<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NYVO — Votre football</title><style>
:root{color-scheme:dark;--red:#ed1746;--muted:#92939f;--line:#28272f}*{box-sizing:border-box}body{margin:0;background:#08080b;color:#f7f6f8;font:15px system-ui,sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #ff6685;outline-offset:3px}button,select{min-height:44px}button:hover{background-color:#ffffff0b}header{max-width:1120px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:24px 26px;border-bottom:1px solid var(--line)}.logo{font-size:28px;font-weight:950;letter-spacing:-2px}.logo i{color:var(--red);font-style:normal}select,input{background:#15151b;border:1px solid var(--line);padding:12px;border-radius:10px;max-width:100%}main{max-width:1050px;margin:auto;padding:32px 24px 120px}h1{font-size:38px;letter-spacing:-1.4px;margin:8px 0 20px}h2{font-size:20px;margin:26px 0 14px}h3{margin:8px 0}.muted,small{color:var(--muted)}small{font-size:12px}.eyebrow{font-size:11px;letter-spacing:2px;color:#e18a9e;text-transform:uppercase}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.wrap{flex-wrap:wrap}.chips{display:flex;gap:8px;overflow:auto;margin:18px 0}.chip,.secondary{border:1px solid var(--line);border-radius:10px;padding:9px 15px;white-space:nowrap}.active{background:#501225!important;border-color:#ac2444!important;color:#fff}.primary{background:linear-gradient(135deg,#b31136,#ed1746);border:1px solid #f23f65;border-radius:12px;padding:13px 23px;font-weight:650;box-shadow:0 5px 25px #b60b2e26}.card{background:linear-gradient(125deg,#19191f,#101015);border:1px solid var(--line);border-radius:18px;padding:22px;margin:12px 0}.hero{background:radial-gradient(ellipse at top right,#56102350,transparent 65%),linear-gradient(120deg,#1b1a21,#101014);border-color:#542331;position:relative}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:24px}.score{font-size:52px;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-2px}.teams{display:flex;justify-content:space-between;align-items:center;text-align:center;margin:22px 0}.team{width:30%;font-weight:600}.crest{width:52px;height:60px;border:1px solid #8d9bb6;border-radius:14px 14px 24px 24px;display:grid;place-items:center;background:linear-gradient(130deg,#25374e,#101820);margin:0 auto 12px;font-size:18px;font-weight:800}.crest.red{background:linear-gradient(130deg,#8d193b,#2c0c16);border-color:#b35d73}.live{color:#ff5b7b;font-size:12px}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);margin-right:6px}.line{border-top:1px solid var(--line);padding:16px 0}.textbtn{color:#ff6b8c}.nav{padding-bottom:env(safe-area-inset-bottom);position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;background:#141419f5;border:1px solid #39313b;border-radius:20px;box-shadow:0 12px 50px #000;padding:6px;z-index:10;width:min(580px,calc(100% - 24px));backdrop-filter:blur(18px)}.nav button{flex:1;border-radius:14px;font-size:11px;padding:8px 2px;color:#a5a4ae}.nav b{display:block;font-size:23px;line-height:28px;font-weight:400}.nav .sel{color:#ff426c;background:#3d1021}.badge{border:1px solid #5b2938;border-radius:6px;padding:4px 7px;font-size:10px;color:#e9a5b6;letter-spacing:.8px}.empty{text-align:center;padding:40px 18px;color:var(--muted)}.onboard{max-width:540px;margin:15px auto}.countries{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice{text-align:left;border:1px solid var(--line);border-radius:12px;padding:16px}.toast{position:fixed;bottom:112px;left:50%;transform:translateX(-50%);background:#341222;border:1px solid #b92f51;padding:14px 22px;border-radius:12px;z-index:40;max-width:90%}dialog{color:inherit;background:#111116;border:1px solid #49303c;border-radius:24px;width:min(560px,95vw);overflow:auto;max-height:88vh;padding:26px}dialog::backdrop{background:#000b;backdrop-filter:blur(7px)}.art{height:155px;border-radius:12px;background:radial-gradient(ellipse at 75% 20%,#a3294f55,transparent 60%),repeating-linear-gradient(90deg,#ffffff02 0 1px,transparent 1px 40px),linear-gradient(135deg,#242634,#0c1016);display:flex;align-items:end;padding:20px;font-size:40px;font-weight:800;letter-spacing:-2px;overflow:hidden}.play{align-items:center;justify-content:center;color:#ff698b}.pitch{height:210px;background:repeating-linear-gradient(0deg,#111f1a 0 35px,#17291f 35px 70px);border:1px solid #405a4c;border-radius:12px;display:grid;place-content:center;gap:22px;text-align:center;letter-spacing:5px}.notice{border-left:2px solid var(--red);padding:10px 16px;background:#36101c44;margin:15px 0;line-height:1.5}.matchrow{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;padding:15px 0}.stat{height:5px;background:#36343d;border-radius:5px;margin:10px 0 20px;overflow:hidden}.stat i{display:block;background:var(--red);height:100%}.foot{margin-top:28px;color:#787782;font-size:11px;line-height:1.6}.search{width:100%;margin:14px 0}@media(max-width:700px){header{padding:17px 20px}main{padding:22px 18px 110px}.grid{display:block}h1{font-size:30px}.card{padding:18px}.score{font-size:43px}.countries{grid-template-columns:1fr 1fr}.nav{bottom:10px}.hide-mobile{display:none}}@media(prefers-reduced-motion:no-preference){main{animation:appear .2s ease}@keyframes appear{from{opacity:.5;transform:translateY(4px)}to{opacity:1;transform:none}}}</style>
<header><button class="logo" data-go="home" aria-label="Accueil NYVO">NYVO<i>·</i></button><div class="row"><button id="country" class="secondary" data-action="country"></button><button data-action="search" aria-label="Rechercher">⌕</button><button data-action="settings" aria-label="Réglages">⚙</button></div></header><main id="app"></main><nav class="nav" aria-label="Navigation principale" id="nav"></nav><dialog id="modal"></dialog><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);const countries=['France','Belgique','Suisse','Royaume-Uni','Espagne','Italie','Allemagne'];let s={country:'France',lang:'Français',onboard:1,follows:[],saved:[],spoiler:false};try{s={...s,...JSON.parse(localStorage.getItem('nyvo-v1')||'{}')}}catch{}let page=s.onboard?'onboard':'home',tab='Direct',filter='Tous',favtab='Mon espace',match=0,scenario='normal',revealed=new Set(),newsfilter='Pour vous',selectedDate='2026-10-18',favoriteQuery='';const names=['Paris Atlas','Milan Stella','Lyon Nord','Berlin Union','Coupe Élite','Ligue Démo'];const matches=[{a:'Paris Atlas',b:'Milan Stella',status:'En direct',time:'67′',score:'2 – 1',channel:'Sport Démo 1',comp:'Coupe Élite'},{a:'Lyon Nord',b:'Berlin Union',status:'À venir',time:'21:00',score:null,channel:null,comp:'Ligue Démo'},{a:'Madrid Sol',b:'Londres City',status:'Terminés',time:'Terminé',score:'1 – 1',channel:'Sport Démo 2',comp:'Coupe Élite'}];matches.forEach((m,i)=>{m.kickoff=i===2?'18:00':'21:00'});s.country=countries.includes(s.country)?s.country:'France';s.onboard=[0,1,2].includes(s.onboard)?s.onboard:1;s.follows=Array.isArray(s.follows)?s.follows.filter(n=>names.includes(n)):[];s.saved=Array.isArray(s.saved)?s.saved.filter(n=>['m0','m1','m2','article','video'].includes(n)):[];s.spoiler=s.spoiler===true;const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const persist=()=>{try{localStorage.setItem('nyvo-v1',JSON.stringify(s))}catch{}};const btn=(txt,action,cls='secondary')=>`<button class="${cls}" data-action="${action}">${txt}</button>`;const chips=(arr,current,type)=>`<div class="chips">${arr.map(x=>`<button class="chip ${x===current?'active':''}" data-${type}="${x}">${x}</button>`).join('')}</div>`;function toast(t){if($('#modal').open){let status=$('#modalStatus');if(!status){status=document.createElement('p');status.id='modalStatus';status.setAttribute('role','status');$('#modal').append(status)}status.textContent=t;return}$('#toast').className='toast';$('#toast').textContent=t;setTimeout(()=>{$('#toast').className='';$('#toast').textContent=''},3500)}function hidden(i=match){return s.spoiler&&!revealed.has(i)}function open(html){$('#modal').innerHTML=`<div class="row"><span class="eyebrow">NYVO · Démonstration</span>${btn('Fermer ×','close','textbtn')}</div>${html}`;$('#modal').showModal()}function go(p){if(p!=='onboard'&&s.onboard)s.onboard=0;page=p;render();window.scrollTo(0,0)}function crest(n,red=false){return `<div class="crest ${red?'red':''}">${n.split(' ').map(x=>x[0]).join('')}</div>`}function card(i){const m=matches[i];return `<article class="card ${i===0?'hero':''}"><div class="row"><span class="eyebrow">${m.comp}</span><span class="live">${hidden(i)?'Sans spoilers':m.status==='En direct'?'● Direct simulé':m.status}</span></div><button class="matchrow" data-match="${i}"><span class="muted">${hidden(i)?m.kickoff:m.time}</span><span><strong>${m.a}</strong><br><span class="muted">${m.b}</span></span><strong>${hidden(i)?'•••':m.score||'—'}</strong></button><div class="row line"><small>${m.channel?m.channel+' · Diffusion fictive':'Diffusion non confirmée'}</small><button data-save="m${i}" aria-label="Enregistrer le match">${s.saved.includes('m'+i)?'★':'☆'}</button></div></article>`}function news(){let cards=`<article class="card"><div class="art">ATLAS<span style="color:#cf315b"> /</span></div><p><span class="badge">OFFICIEL · DÉMO</span></p><h3>Paris Atlas prépare son prochain rendez-vous</h3><p class="muted">Club Démo · 18 octobre 2026</p><div class="row">${btn('Lire l’article','article','textbtn')}<button data-save="article">${s.saved.includes('article')?'★ Enregistré':'☆ Enregistrer'}</button></div></article><article class="card"><span class="badge">RUMEUR · NON CONFIRMÉ</span><h3>Milan Stella : une piste au milieu</h3><small>Mercato Démo · 18 octobre 2026</small><p>Exemple fictif pour distinguer une rumeur d’une annonce officielle.</p></article>`;const parts=cards.match(/<article[\s\S]*?<\/article>/g);if(page==='news'&&newsfilter==='Mercato')return parts[1];if((page==='home'||newsfilter==='Pour vous')&&s.follows.length){const selected=parts.filter((_,i)=>s.follows.includes(i?'Milan Stella':'Paris Atlas'));return selected.join('')||'<div class="empty">Aucune actualité de démonstration pour vos favoris. Consultez le fil général.</div>'}return cards}function videos(){return `<article class="card"><button class="art play" style="width:100%" data-action="video" aria-label="Lancer la démonstration vidéo">▷</button><p><span class="badge">OFFICIEL · DÉMO</span></p><h3>Dans les coulisses de Paris Atlas</h3><div class="row"><small>Club Démo · Aperçu</small><button data-save="video">${s.saved.includes('video')?'★ Enregistré':'☆ Enregistrer'}</button></div></article><article class="card"><span class="badge">AMATEUR · DÉMO</span><h3>Le football au bord du terrain</h3><p class="muted">Les contenus de créateurs autorisés seront intégrés au pilote connecté.</p>${btn('Voir l’aperçu','video')}</article>`}function render(){persist();$('#country').textContent=s.country;$('#nav').style.display=page==='onboard'?'none':'flex';$('#nav').innerHTML=[['home','⌂','Accueil'],['matches','◉','Matchs'],['news','▤','Actualités'],['videos','▷','Vidéos'],['favorites','☆','Favoris']].map(([p,icon,l])=>`<button data-go="${p}" class="${page===p||(page==='match'&&p==='matches')?'sel':''}"><b>${icon}</b>${l}</button>`).join('');let h='';if(page==='onboard'){h=`<div class="onboard"><div class="row"><span class="eyebrow">Premiers pas · ${s.onboard}/2</span>${btn('Plus tard','skip','textbtn')}</div><h1>${s.onboard===1?'Votre football.<br>Votre point de vue.':'Le jeu commence<br>avec vos favoris.'}</h1><p class="muted">${s.onboard===1?'Choisissez votre pays de diffusion. Vous pourrez le modifier à tout moment.':'Suivez vos équipes et compétitions. Aucune inscription nécessaire.'}</p>${s.onboard===1?`<div class="countries">${countries.map(c=>`<button class="choice ${s.country===c?'active':''}" data-country="${c}">${c}${s.country===c?' ✓':''}</button>`).join('')}</div><h2>Langue de l’interface</h2><p class="muted">Ce premier prototype est en français. L’interface anglaise est prévue pour la version suivante.</p>`:`<input class="search" id="favoriteSearch" value="${esc(favoriteQuery)}" placeholder="Rechercher une équipe ou une compétition" aria-label="Rechercher un favori"><div id="choices">${choices(favoriteQuery)}</div><p class="muted">${s.follows.length} favoris sélectionnés · Alertes configurables séparément.</p>`}<div class="row" style="margin-top:28px">${s.onboard===2?btn('Retour','backOnboard'):''}${btn(s.onboard===1?'Continuer →':'Accéder à l’accueil →','next','primary')}</div></div>`}
if(page==='home')h=`<div class="row"><div><span class="eyebrow">DIMANCHE 18 OCTOBRE · DÉMO</span><h1>Au cœur du jeu.</h1></div>${btn(s.spoiler?'◉ Sans spoilers':'Activer sans spoilers','spoiler','secondary hide-mobile')}</div><div class="grid"><section><div class="row"><h2>À la une</h2><button class="textbtn" data-go="matches">Tous les matchs →</button></div>${card(0)}<h2>Votre programme TV</h2><div class="card"><span class="eyebrow">${s.country} · Europe/Paris</span><h3>Paris Atlas — Milan Stella</h3><p class="muted">20:30 · Avant-match<br>21:00 · Match intégral<br>23:00 · Après-match</p>${btn('Où regarder →','watchHome','primary')}</div></section><section><h2>Votre sélection</h2>${news()}</section></div>`;
if(page==='matches')h=`<span class="eyebrow">Calendrier · Démonstration</span><h1>Matchs</h1><div class="row"><input type="date" id="date" aria-label="Date des matchs" value="${selectedDate}">${btn('Programme TV','tv')}</div>${chips(['Tous','En direct','À venir','Terminés','Diffusés'],filter,'filter')}<div class="notice" id="dateNote">${selectedDate==='2026-10-18'?'Rencontres fictives du 18 octobre 2026 · Pays : '+s.country:'Aucun match de démonstration à cette date. Choisissez le 18 octobre 2026.'}</div>${(selectedDate==='2026-10-18'?matches:[]).map((m,i)=>filter==='Tous'||filter===m.status||filter==='Diffusés'&&m.channel?card(i):'').join('')}`;
if(page==='match'){let m=matches[match],hide=hidden(),unknown=scenario==='unknown'||!m.channel,stopped=scenario==='stopped'&&m.status==='En direct';h=`<div class="row"><button data-go="matches" class="textbtn">← Matchs</button><button data-save="m${match}">${s.saved.includes('m'+match)?'★ Enregistré':'☆ Enregistrer'}</button></div><div class="card hero"><div class="row"><span class="eyebrow">${m.comp} · Démo</span><span class="live">${hide?'Sans spoilers':stopped?'Direct interrompu':m.status==='En direct'?'● Direct simulé':m.status}</span></div><div class="teams"><div class="team">${crest(m.a)}${m.a}</div><div><div class="score">${hide?'•••':m.score||m.time}</div><small>${hide?'Horaire prévu · '+m.kickoff:stopped?'Dernier état connu · 67′':m.time}</small></div><div class="team">${crest(m.b,true)}${m.b}</div></div><div class="row line wrap"><div><small>${s.country} · Diffusion fictive</small><p>${unknown?'Diffusion non confirmée':m.channel}</p></div>${btn('Où regarder','watch','primary')}</div></div>${hide?`<div class="notice">Scores, événements et contenus révélateurs sont masqués. ${btn('Révéler ce match','reveal','textbtn')}</div>`:stopped?`<div class="notice">Suivi interrompu · Dernière actualisation fictive à 22:24. Le match peut continuer. ${btn('Réessayer','retry','textbtn')}</div>`:''}${chips(['Direct','Compositions','Statistiques','Classement'],tab,'tab')}<section class="card">${hide?'<div class="empty">Contenu protégé par le mode sans spoilers.</div>':detail(m)}</section><h2>Tester les états</h2><div class="row wrap"><select id="scenario" aria-label="Scénario de démonstration"><option value="normal" ${scenario==='normal'?'selected':''}>État normal</option><option value="unknown" ${scenario==='unknown'?'selected':''}>Diffusion non confirmée</option><option value="stopped" ${m.status!=='En direct'?'disabled':''} ${scenario==='stopped'?'selected':''}>Direct interrompu</option><option value="limited" ${scenario==='limited'?'selected':''}>Données limitées</option></select>${btn(s.spoiler?'Désactiver sans spoilers':'Activer sans spoilers','spoiler')}</div>`}
if(page==='favorites')h=`<span class="eyebrow">Votre football, à portée de main</span><h1>Favoris</h1>${chips(['Mon espace','Enregistrés'],favtab,'favtab')}${favtab==='Mon espace'?`<div class="row">${btn('＋ Ajouter','addFavorite')}${btn('Gérer les alertes','alerts')}</div>${s.follows.length?s.follows.map(n=>`<div class="card row"><div><h3>${n}</h3><small>${names.indexOf(n)<4?'Équipe · Démo':'Compétition · Démo'}</small></div><button data-follow="${n}" aria-label="Ne plus suivre ${n}">★</button></div>`).join(''):'<div class="empty">Votre espace attend ses premiers favoris.</div>'}`:s.saved.length?s.saved.map(id=>id[0]==='m'?card(+id[1]):`<div class="card row"><button data-action="${id}">${id==='article'?'La préparation de Paris Atlas':'Dans les coulisses de Paris Atlas'} →</button><button data-save="${id}" aria-label="Retirer des enregistrés">★</button></div>`).join(''):'<div class="empty">Enregistrez un match, un article ou une vidéo pour le retrouver ici.</div>'}<p class="muted">Préférences conservées sur ce navigateur. Synchronisation par compte à venir.</p>`;
if(page==='news')h=`<span class="eyebrow">L’essentiel, avec ses sources</span><h1>Actualités</h1>${chips(['Pour vous','Fil général','Mercato'],newsfilter,'newsfilter')}${s.spoiler?'<div class="notice">Mode sans spoilers actif : seuls les aperçus non révélateurs sont affichés.</div>':''}${newsfilter==='Pour vous'?'<p class="muted">Aperçu de votre fil personnalisé · Contenus de démonstration.</p>':''}${news()}`;
if(page==='videos')h=`<span class="eyebrow">Le football se regarde aussi autrement</span><h1>Vidéos</h1><p class="muted">Officielles et amateurs sélectionnées · Lecture à la demande</p>${videos()}`;
$('#app').innerHTML=h+'<p class="foot">NYVO · Prototype V0.2 — Données, chaînes et contenus fictifs.<br>Aucun résultat réel ni abonnement. Les informations de diffusion seront vérifiées lors du pilote connecté.</p>'}
function choices(q=''){return names.filter(n=>n.toLowerCase().includes(q.toLowerCase())).map(n=>`<button style="width:100%;margin:5px 0" class="choice ${s.follows.includes(n)?'active':''}" data-follow="${n}">${n}<span style="float:right">${s.follows.includes(n)?'✓':'＋'}</span></button>`).join('')||'<p class="muted">Aucun résultat dans le catalogue de démonstration.</p>'}
function detail(m){if(m.status==='Terminés')return '<h3>Match terminé · Démonstration</h3><p>Score final fictif : 1–1.</p><p class="muted">Les événements et données détaillées ne sont pas disponibles pour cette rencontre.</p>';if(scenario==='limited')return '<h3>Suivi limité</h3><p class="muted">Seuls l’horaire et le résultat de démonstration sont disponibles. Les données manquantes ne sont pas affichées comme zéro.</p>';if(m.status==='À venir')return '<h3>Avant-match</h3><p class="muted">Compositions et statistiques non disponibles. Elles apparaîtront lorsqu’elles seront confirmées.</p>';if(tab==='Direct')return `<h2 style="margin-top:0">Le fil du match</h2>${['63′|BUT · Paris Atlas|Jules Martin · 2–1','51′|Changement · Milan Stella|L. Morel remplace A. Diallo','38′|BUT · Milan Stella|R. Conti · 1–1','12′|BUT · Paris Atlas|T. Blanc · 1–0'].map(x=>{const a=x.split('|');return `<div class="row line"><span class="live">${a[0]}</span><div style="flex:1"><strong>${a[1]}</strong><p class="muted">${a[2]}</p></div></div>`}).join('')}${btn('Moments forts · Schéma 2D','goal')}`;if(tab==='Compositions')return '<h3>Formation de démonstration · 4–3–3</h3><div class="pitch">9　　11　　7<br>8　　6　　10<br>3　　4　　5　　2<br>1</div><p class="muted">Schéma illustratif, pas une composition réelle.</p>';if(tab==='Statistiques')return '<h3>Statistiques de démonstration</h3>'+[['Possession','58 %','42 %',58],['Tirs','12','8',60],['Tirs cadrés','5','3',62]].map(a=>`<div class="row"><span>${a[1]}</span><small>${a[0]}</small><span>${a[2]}</span></div><div class="stat"><i style="width:${a[3]}%"></i></div>`).join('')+'<small>xG : non disponible · Source fictive · 67′</small>';return '<h3>Groupe A · Classement fictif provisoire</h3>'+['Paris Atlas · 9 pts','Milan Stella · 6 pts','Madrid Sol · 4 pts','Londres City · 1 pt'].map((n,i)=>`<div class="line">${i+1}　${n}</div>`).join('')}
function watch(){const m=matches[match],unknown=scenario==='unknown'||!m.channel;open(`<h1>Où regarder</h1><h3>${m.a} — ${m.b}</h3><p class="muted">${s.country} · Europe/Paris · 18 octobre 2026</p>${unknown?'<div class="notice"><h3>Diffusion non confirmée</h3>Aucune chaîne confirmée dans cet exemple. Cela ne signifie pas que le match ne sera pas diffusé.</div>'+btn('Actualiser','refresh'): `<div class="card"><span class="badge">DIFFUSION FICTIVE</span><h2>${m.channel}</h2><p>Match intégral · Accès payant simulé</p>${btn('Ouvrir chez le diffuseur ↗','broadcaster','primary')}<p><small>Destination : exemple de site diffuseur, aucun lien réel.</small></p></div><h2>Toute la soirée</h2>${(match===0?['20:30|Avant-match|Sport Démo 1','21:00|Match intégral|Sport Démo 1','23:00|Après-match|Sport Démo 3']:['17:30|Avant-match|Sport Démo 2','18:00|Match intégral|Sport Démo 2','20:00|Après-match|Sport Démo 2']).map(v=>{let a=v.split('|');return `<div class="line row"><strong>${a[0]}</strong><span>${a[1]}</span><small>${a[2]}</small></div>`}).join('')}${match===0?'<p class="muted">Alternative : multiplex sur Sport Démo 2 (fictif).</p>':''}`}<small>Dernière vérification fictive : 18/10/2026 à 18:00. L’abonnement reste géré par le diffuseur.</small>`)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.go){go(d.go);return}if(d.match!==undefined){if($('#modal').open)$('#modal').close();match=+d.match;scenario='normal';tab='Direct';go('match');return}if(d.save){s.saved=s.saved.includes(d.save)?s.saved.filter(x=>x!==d.save):[...s.saved,d.save];render();return}if(d.follow){s.follows=s.follows.includes(d.follow)?s.follows.filter(x=>x!==d.follow):[...s.follows,d.follow];render();if($('#modal').open&&$('#choicesModal'))$('#choicesModal').innerHTML=choices();return}if(d.country){s.country=d.country;render();if($('#modal').open)$('#modal').close();return}if(d.filter){filter=d.filter;render();return}if(d.tab){tab=d.tab;render();return}if(d.favtab){favtab=d.favtab;render();return}if(d.newsfilter){newsfilter=d.newsfilter;render();return}const a=d.action;if(a==='close')$('#modal').close();if(a==='next'){if(s.onboard===1){s.onboard=2;render()}else{s.onboard=0;go('home')}}if(a==='skip'){s.onboard=0;go('home')}if(a==='backOnboard'){s.onboard=1;render()}if(a==='country')open('<h1>Pays de diffusion</h1><p class="muted">Les diffusions de ce prototype sont fictives dans tous les pays.</p><div class="countries">'+countries.map(c=>`<button class="choice ${s.country===c?'active':''}" data-country="${c}">${c}</button>`).join('')+'</div>');if(a==='spoiler'){s.spoiler=!s.spoiler;revealed.clear();render();if($('#modal').open)$('#modal').close()}if(a==='reveal'){revealed.add(match);render()}if(a==='watch')watch();if(a==='watchHome'){match=0;scenario='normal';watch()}if(a==='retry'){scenario='normal';render();toast('Simulation : le suivi a repris.')}if(a==='refresh')toast('Démonstration : la diffusion reste non confirmée.');if(a==='broadcaster')toast('Démonstration : aucun service réel n’est ouvert.');if(a==='addFavorite')open('<h1>Vos favoris</h1><div id="choicesModal">'+choices()+'</div>');if(a==='alerts')open('<h1>Alertes</h1><p>Les notifications ne sont pas envoyées dans ce prototype.</p><p class="muted">Le pilote proposera rappels, événements, changements de diffusion et actualités, avec horaires silencieux.</p>');if(a==='settings')open('<h1>Réglages</h1>'+btn(s.spoiler?'Désactiver sans spoilers':'Activer sans spoilers','spoiler')+'<p class="muted">Pays : '+s.country+' · Français<br>Préférences conservées localement.</p>'+btn('Revoir le premier lancement','restart')+'<h2>Tester le prototype</h2><p class="muted">Ouvrez un match puis utilisez « Tester les états » pour simuler les différentes situations.</p>');if(a==='restart'){$('#modal').close();favoriteQuery='';s.onboard=1;go('onboard')}if(a==='tv'){match=0;scenario='normal';watch()}if(a==='search')open('<h1>Recherche</h1><input id="globalSearch" class="search" placeholder="Club, compétition ou match" aria-label="Recherche globale"><div id="results" class="muted">Recherchez dans le catalogue fictif.</div>');if(a==='article')open('<span class="badge">OFFICIEL · DÉMO</span><h1>Paris Atlas prépare son prochain rendez-vous</h1><p class="muted">Club Démo · 18 octobre 2026</p><p>Le groupe retrouve le terrain pour une séance consacrée aux automatismes collectifs et à la préparation du prochain match.</p><p>Ce texte est inventé pour tester la lecture d’un article, sa source et son enregistrement.</p>');if(a==='video')open('<h1>Aperçu vidéo</h1><div class="art play">▷ NYVO</div><p>Emplacement du lecteur à la demande.</p><p class="muted">Aucune vidéo réelle n’est intégrée : les médias seront ajoutés avec les autorisations nécessaires lors du pilote connecté.</p>');if(a==='goal'&&hidden()){toast('Révélez ce match pour consulter ses moments forts.');return}if(a==='goal')open('<h1>Moment fort · Démo</h1><div class="pitch">⚽ → → ◎</div><p>Schéma fictif illustratif, sans trajectoire réelle ni déplacement reconstitué.</p><p class="muted">Les représentations détaillées seront limitées aux données disponibles et vérifiées.</p>')});document.addEventListener('change',e=>{if(e.target.id==='scenario'){scenario=e.target.value==='stopped'&&matches[match].status!=='En direct'?'normal':e.target.value;render()}if(e.target.id==='date'){selectedDate=e.target.value;render()}});document.addEventListener('input',e=>{if(e.target.id==='favoriteSearch'){favoriteQuery=e.target.value;$('#choices').innerHTML=choices(favoriteQuery);}if(e.target.id==='globalSearch'){let q=e.target.value.trim().toLowerCase();$('#results').innerHTML=q?matches.map((m,i)=>[m.a,m.b,m.comp].some(n=>n.toLowerCase().includes(q))?`<button class="choice" style="width:100%;margin:6px 0" data-match="${i}">${m.a} — ${m.b}<br><small>${m.comp}</small></button>`:'').join('')||'Aucun résultat dans la démonstration.':'Recherchez dans le catalogue fictif.'}});render();
</script></html>
