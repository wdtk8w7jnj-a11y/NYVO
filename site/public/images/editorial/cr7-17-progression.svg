<rect x="314" y="223" width="150" height="397" rx="8" fill="#3a3d48"/><text x="389" y="203" text-anchor="middle" fill="#f5f5f7" font-size="40" font-weight="800">13</text><text x="389" y="660" text-anchor="middle" fill="#a8abb7" font-size="20">Huitièmes</text><text x="389" y="688" text-anchor="middle" fill="#6f7380" font-size="17">2 + 2 contre Schalke</text>
<rect x="524" y="193" width="150" height="427" rx="8" fill="#7a1430"/><text x="599" y="173" text-anchor="middle" fill="#f5f5f7" font-size="40" font-weight="800">14</text><text x="599" y="660" text-anchor="middle" fill="#a8abb7" font-size="20">Quart aller</text><text x="599" y="688" text-anchor="middle" fill="#6f7380" font-size="17">record égalé, Dortmund</text>
