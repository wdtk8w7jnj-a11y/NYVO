<title id="t">Progression des buts de Cristiano Ronaldo, Ligue des champions 2013/14</title>
<desc id="d">Total cumulé : 9 après la phase de groupes, 13 après les huitièmes contre Schalke, 14 au quart aller contre Dortmund (record égalé), 16 après la demi-finale retour à Munich (record dépassé), 17 après la finale de Lisbonne. Source : UEFA.com.</desc>
