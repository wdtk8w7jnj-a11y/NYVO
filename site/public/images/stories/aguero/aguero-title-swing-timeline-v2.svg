<svg xmlns="http://www.w3.org/2000/svg" xml:lang="fr" viewBox="0 0 1200 1970" width="1200" height="1970" role="img" aria-labelledby="t d">
<title id="t">Dernière journée 2011/12 : le leader provisoire minute par minute</title>
<desc id="d">Frise des six moments clés du 13 mai 2012, avec le score de Manchester City–QPR et de Sunderland–Manchester United, et le leader projeté si les scores du moment tiennent. 20e minute, Rooney : City 0–0 QPR, Sunderland 0–1 United, United en tête. 39e, Zabaleta : City 1–0, City en tête à la différence de buts. 48e, Cissé : 1–1, United en tête. Joey Barton est expulsé, QPR à dix. 66e, Mackie : 1–2, United en tête. 90e+2, Džeko : 2–2, United en tête. Bolton–Stoke se termine sur un nul, QPR est maintenu, puis le match de Sunderland s’achève sur la victoire 1–0 de United. 93:20, Agüero : 3–2, City champion.</desc>
<metadata>Version recréée pour NYVO V36 le 21 octobre 2026, avec accord éditorial, d’après les faits et légendes validés de l’article V7. Ce n’est pas le fichier original perdu.</metadata>
