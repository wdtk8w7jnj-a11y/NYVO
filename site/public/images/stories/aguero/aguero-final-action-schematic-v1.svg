<svg xmlns="http://www.w3.org/2000/svg" xml:lang="fr" viewBox="0 0 1200 1400" width="1200" height="1400" role="img" aria-labelledby="t d">
<title id="t">93:20 : la combinaison Agüero–Balotelli–Agüero, schéma illustratif</title>
<desc id="d">Schéma illustratif, non à l’échelle, de l’action du but du titre de Manchester City contre QPR le 13 mai 2012. 1. Sergio Agüero transmet le ballon à Mario Balotelli. 2. Balotelli glisse mais parvient à lui remettre le ballon dans la course. 3. Agüero contourne le défenseur de QPR Taye Taiwo. 4. Il frappe au premier poteau ; à 93:20, le ballon franchit la ligne, 3–2. Les positions et les trajectoires sont simplifiées.</desc>
<metadata>Version recréée pour NYVO V36 le 21 octobre 2026, avec accord éditorial, d’après les faits et légendes validés de l’article V7. Ce n’est pas le fichier original perdu.</metadata>
