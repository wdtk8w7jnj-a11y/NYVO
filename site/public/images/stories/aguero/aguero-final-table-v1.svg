<svg xmlns="http://www.w3.org/2000/svg" xml:lang="fr" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">Classement final de la Premier League 2011/12 : Manchester City et Manchester United</title>
<desc id="d">Classement final, haut du tableau. 1er, Manchester City : 38 matchs, 28 victoires, 5 nuls, 5 défaites, 93 buts marqués, 29 encaissés, différence de buts +64, 89 points, champion. 2e, Manchester United : 38 matchs, 28 victoires, 5 nuls, 5 défaites, 89 buts marqués, 33 encaissés, différence de buts +56, 89 points. À égalité de points, City est champion grâce à sa différence de buts supérieure de huit buts.</desc>
<metadata>Version recréée pour NYVO V36 le 21 octobre 2026, avec accord éditorial, d’après les faits et légendes validés de l’article V7. Ce n’est pas le fichier original perdu.</metadata>
